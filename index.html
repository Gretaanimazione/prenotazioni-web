<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prenota con Greta Animazione e Allestimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&family=Cinzel+Decorative:wght@700;900&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    /* Tema di default: 🎈 Compleanno bimbi */
    --rosa-chiara: #ffe4ec;
    --rosa: #ec6f91;
    --rosa-scura: #d6467b;
    --oro: #c9a15a;
    --menta: #8fd3c0;
    --crema: #fff8f0;
    --superficie: #ffffff;
    --testo: #332b28;
    --testo-muto: #8a7d78;
    --bordo: #f0d9d0;
    --bordo-tratteggiato: #f0b8c4;
    --danger: #c4455c;
    --bagliore-1: rgba(255, 210, 222, 0.55);
    --bagliore-2: rgba(255, 231, 199, 0.55);
    --globo1-a: #f6e1ae; --globo1-b: #d8b366; /* oro */
    --globo2-a: #ffd9d0; --globo2-b: #ef9fa0; /* corallo */
    --globo3-a: #fffaf2; --globo3-b: #f0e1d0; /* crema */
    --globo4-a: #cdf0e3; --globo4-b: #8fd3c0; /* menta */
    --globo5-a: #ffe7ec; --globo5-b: #f2aabd; /* rosa chiaro */
  }

  /* 💍 Matrimonio bimbi: elegante, avorio e oro con fiori */
  body.tema-matrimonio_bimbi {
    --rosa-chiara: #f7f1e0;
    --rosa: #b8935a;
    --rosa-scura: #8f6f3f;
    --oro: #c9a15a;
    --menta: #8a9a6f;
    --crema: #fffdf7;
    --superficie: #ffffff;
    --testo: #2e2a24;
    --testo-muto: #8a7f6a;
    --bordo: #ece3d0;
    --bordo-tratteggiato: #d9c18f;
    --danger: #b2554a;
    --bagliore-1: rgba(201, 161, 90, 0.16);
    --bagliore-2: rgba(201, 161, 90, 0.1);
  }

  /* 🥂 Intrattenimento adulti: sofisticato, notturno/dorato */
  body.tema-intrattenimento_adulti {
    --rosa-chiara: #3c2f38;
    --rosa: #caa15a;
    --rosa-scura: #9c7a3e;
    --oro: #d8b878;
    --menta: #8a6a4a;
    --crema: #241b24;
    --superficie: #2f2430;
    --testo: #f3e9e2;
    --testo-muto: #b9a8ae;
    --bordo: #4a3a41;
    --bordo-tratteggiato: #8a6a4a;
    --danger: #e08a93;
    --bagliore-1: rgba(154, 110, 74, 0.3);
    --bagliore-2: rgba(90, 40, 52, 0.35);
    --globo1-a: #e9cf9a; --globo1-b: #b98f4a; /* oro */
    --globo2-a: #8a4a52; --globo2-b: #5c2a34; /* bordeaux */
    --globo3-a: #5c4a56; --globo3-b: #3a2c36; /* antracite */
    --globo4-a: #6a5240; --globo4-b: #4a3626; /* bronzo */
    --globo5-a: #4a3a48; --globo5-b: #2e2430; /* prugna */
  }

  /* ⚡ Harry Potter: pergamena chiara, bordeaux e oro (collaborazione Binario Magico Pub) */
  body.tema-harry_potter {
    --rosa-chiara: #f6ead0;
    --rosa: #7a1f1f;
    --rosa-scura: #5c1414;
    --oro: #b8860b;
    --menta: #2f4d3a;
    --crema: #f6ecd6;
    --superficie: #fdf8ea;
    --testo: #3b2a1a;
    --testo-muto: #8a7355;
    --bordo: #e0cfa0;
    --bordo-tratteggiato: #b8860b;
    --danger: #a83232;
    --bagliore-1: rgba(184, 134, 11, 0.18);
    --bagliore-2: rgba(122, 31, 31, 0.1);
    --globo1-a: #e8c874; --globo1-b: #b8860b; /* oro */
    --globo2-a: #a83232; --globo2-b: #7a1f1f; /* bordeaux */
    --globo3-a: #4a7a5a; --globo3-b: #2f4d3a; /* verde smeraldo */
    --globo4-a: #d9c49a; --globo4-b: #b39866; /* pergamena scura */
    --globo5-a: #6b5a8a; --globo5-b: #4a3d63; /* viola magico */
  }
  body.tema-harry_potter .decorazione-palloncini { display: none; }
  body.tema-harry_potter .decorazione-magia { display: block; }
  body.tema-harry_potter .titolo-form {
    font-family: "Cinzel Decorative", serif;
    font-size: 30px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* 🐧 Pingus: azzurro/bianco con accenti arancio (collaborazione Pingus English School) */
  body.tema-pingus {
    --rosa-chiara: #dcf0fb;
    --rosa: #2f8fd1;
    --rosa-scura: #1c5f8f;
    --oro: #f0a83c;
    --menta: #6fc4c9;
    --crema: #f2f9ff;
    --superficie: #ffffff;
    --testo: #16324a;
    --testo-muto: #6f8ba0;
    --bordo: #cfe8f7;
    --bordo-tratteggiato: #8fcdec;
    --danger: #d1554f;
    --bagliore-1: rgba(47, 143, 209, 0.16);
    --bagliore-2: rgba(240, 168, 60, 0.12);
    --globo1-a: #bfe4f7; --globo1-b: #2f8fd1; /* azzurro */
    --globo2-a: #ffe1b8; --globo2-b: #f0a83c; /* arancio, il becco */
    --globo3-a: #ffffff; --globo3-b: #cfe8f7; /* bianco/ghiaccio */
    --globo4-a: #9fd6de; --globo4-b: #6fc4c9; /* acqua */
    --globo5-a: #e4f4fc; --globo5-b: #8fcdec; /* azzurro chiaro */
  }
  body.tema-pingus .titolo-form::before { content: "🐧 "; }

  /* 🎄 Natale: crema calda, rosso e oro con rami di pino */
  body.tema-natale {
    --rosa-chiara: #fbeceb;
    --rosa: #a8323a;
    --rosa-scura: #7a1f26;
    --oro: #c9a15a;
    --menta: #3a6b4a;
    --crema: #fdf6ec;
    --superficie: #ffffff;
    --testo: #3a2420;
    --testo-muto: #8a7368;
    --bordo: #f0ddd2;
    --bordo-tratteggiato: #d99a54;
    --danger: #c4455c;
    --bagliore-1: rgba(168, 50, 58, 0.08);
    --bagliore-2: rgba(201, 161, 90, 0.16);
    --globo1-a: #f0dba0; --globo1-b: #c9a15a; /* oro */
    --globo2-a: #f2a8ab; --globo2-b: #a8323a; /* rosso */
    --globo3-a: #fffaf2; --globo3-b: #f0e1d0; /* crema */
    --globo4-a: #a8d9b8; --globo4-b: #3a6b4a; /* verde pino */
    --globo5-a: #f7d4d6; --globo5-b: #d97e85; /* rosso chiaro */
  }
  body.tema-natale .decorazione-palloncini { display: none; }
  body.tema-natale .decorazione-natale { display: block; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--testo);
    background:
      radial-gradient(circle at 0% 0%, var(--bagliore-1), transparent 42%),
      radial-gradient(circle at 100% 0%, var(--bagliore-2), transparent 42%),
      var(--crema);
  }
  .pagina { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Intestazione con palloncini ---------- */
  .intestazione { position: relative; padding: 8px 20px 6px; text-align: center; overflow: hidden; }
  .decorazione-palloncini { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; }
  .decorazione-fiori { display: none; width: 100%; height: auto; pointer-events: none; user-select: none; }
  .decorazione-swirl { display: none; width: 100%; height: auto; pointer-events: none; user-select: none; }
  .decorazione-magia { display: none; width: 100%; height: auto; pointer-events: none; user-select: none; }
  .decorazione-natale { display: none; width: 100%; height: auto; pointer-events: none; user-select: none; }
  body.tema-matrimonio_bimbi .decorazione-palloncini { display: none; }
  body.tema-matrimonio_bimbi .decorazione-fiori { display: block; }
  body.tema-intrattenimento_adulti .decorazione-palloncini { display: none; }
  body.tema-intrattenimento_adulti .decorazione-swirl { display: block; }
  .decorazione-anelli { display: none; text-align: center; margin: 14px 0 0; opacity: 0.8; }
  body.tema-matrimonio_bimbi .decorazione-anelli { display: block; }
  .decorazione-anelli svg { width: 34px; height: 22px; }
  .logo-riquadro { position: relative; margin-top: -34px; }
  .logo-script {
    font-family: "Alex Brush", cursive;
    font-size: 46px;
    color: var(--testo);
    line-height: 1;
  }
  .logo-script .cuore { color: var(--rosa); font-size: 0.6em; vertical-align: middle; }
  .logo-sottotitolo {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: var(--rosa-scura);
    margin-top: 2px;
  }
  .divisore-oro {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px auto 0;
    max-width: 220px;
    color: var(--oro);
  }
  .divisore-oro::before, .divisore-oro::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--oro));
  }
  .divisore-oro::after { background: linear-gradient(90deg, var(--oro), transparent); }
  .divisore-oro span { font-size: 13px; }

  .contenuto { flex: 1; padding: 12px 20px 20px; }
  .caricamento { text-align: center; color: var(--testo-muto); padding: 40px 0; }

  .titolo-form {
    font-family: "Alex Brush", cursive;
    font-size: 40px;
    color: var(--rosa-scura);
    text-align: center;
    margin: 4px 0 0;
  }
  .istruzioni { color: var(--testo-muto); margin: 10px 0 22px; text-align: center; white-space: pre-wrap; }

  .campo { margin-bottom: 18px; }
  .campo label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  .campo .obbligatoria { color: var(--rosa); }
  .campo .descrizione { font-size: 12px; color: var(--testo-muto); margin-top: 4px; }
  .campo .copia-descrizione {
    display: block;
    margin-top: 6px;
    background: none;
    border: none;
    color: var(--rosa-scura);
    font-weight: 700;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .campo-input-wrap { position: relative; }
  .campo-icona {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--rosa);
    pointer-events: none;
  }
  .campo-icona svg { width: 100%; height: 100%; }

  .campo input[type=text], .campo input[type=tel], .campo input[type=email],
  .campo input[type=number], .campo input[type=date], .campo input[type=time],
  .campo select, .campo textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--bordo);
    border-radius: 12px;
    font-size: 16px;
    background: var(--superficie);
    color: var(--testo);
    font-family: inherit;
    box-shadow: 0 2px 8px rgba(214, 70, 123, 0.06);
  }
  .campo .campo-input-wrap input { padding-left: 46px; }
  .campo textarea { min-height: 90px; resize: vertical; }
  .suggerimenti-indirizzo {
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    margin: 0;
    padding: 6px 0;
    list-style: none;
    background: var(--superficie);
    border: 1px solid var(--bordo);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    max-height: 220px;
    overflow-y: auto;
  }
  .suggerimenti-indirizzo li {
    padding: 10px 16px;
    font-size: 14px;
    color: var(--testo);
    cursor: pointer;
  }
  .suggerimenti-indirizzo li:hover {
    background: var(--rosa-chiara);
  }
  /* Le icone native di data/ora restano scure di default: sui temi scuri diventerebbero
     invisibili sopra un campo altrettanto scuro. */
  body.tema-intrattenimento_adulti .campo input::-webkit-calendar-picker-indicator { filter: invert(0.85); }

  .opzioni-riga { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .opzioni-riga input { width: auto; }

  .griglia-pacchetti { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card-pacchetto {
    border: 2px solid var(--bordo);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: var(--superficie);
    text-align: center;
    transition: border-color 0.15s;
    box-shadow: 0 2px 10px rgba(214, 70, 123, 0.08);
  }
  .card-pacchetto.selezionato { border-color: var(--rosa); box-shadow: 0 0 0 3px rgba(236, 111, 145, 0.18); }
  .card-pacchetto img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: var(--crema); }
  .card-pacchetto .nome-pacchetto { padding: 8px 6px; font-size: 13px; font-weight: 600; }

  .pulsante {
    display: inline-block;
    width: 100%;
    padding: 15px 20px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--rosa), var(--rosa-scura));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 6px 16px rgba(214, 70, 123, 0.28);
  }
  .pulsante:disabled { opacity: 0.5; cursor: not-allowed; }
  .pulsante.secondario { background: var(--superficie); color: var(--testo); border: 1px solid var(--bordo); box-shadow: none; }
  .pulsante.pericolo { background: var(--danger); box-shadow: none; }
  .errore { color: var(--danger); font-size: 14px; margin: 8px 0; }
  .avviso-bozza { font-size: 12px; color: var(--testo-muto); text-align: center; margin-top: 10px; }

  /* ---------- Schermata di conferma ---------- */
  .schermata-conferma { text-align: center; padding: 10px 0 20px; }
  .titolo-serif {
    font-family: "Playfair Display", serif;
    font-weight: 800;
    font-size: 28px;
    margin: 0;
  }
  .titolo-script-rosa {
    font-family: "Alex Brush", cursive;
    color: var(--rosa-scura);
    font-size: 42px;
    line-height: 1.1;
    margin: 0 0 10px;
  }
  .riga-ribbon { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; }
  .riga-ribbon .stella { color: var(--oro); font-size: 18px; }
  .ribbon-codice {
    display: inline-block;
    padding: 10px 30px;
    background: linear-gradient(135deg, var(--rosa), var(--rosa-scura));
    color: #fff;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.5px;
    clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
  }

  .scheda-grazie {
    background: var(--superficie);
    border: 1.5px dashed var(--bordo-tratteggiato);
    border-radius: 22px;
    padding: 26px 20px 20px;
    text-align: center;
  }
  .cerchio-icona-grande {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--rosa-chiara);
    color: var(--rosa-scura);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
  }
  .cerchio-icona-grande svg { width: 28px; height: 28px; }
  .testo-grazie { font-family: "Playfair Display", serif; font-size: 17px; margin: 0; }
  .testo-grazie b { color: var(--rosa-scura); }
  .cuore-divisore { color: var(--oro); margin: 14px 0; font-size: 14px; }

  .riga-icona { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px dashed var(--bordo); text-align: left; }
  .riga-icona:first-of-type { border-top: none; }
  .cerchio-icona {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--rosa-chiara);
    color: var(--rosa-scura);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cerchio-icona svg { width: 18px; height: 18px; }
  .riga-icona-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--testo-muto); }
  .riga-icona-valore { font-size: 15px; font-weight: 600; margin-top: 1px; }

  .box-busta {
    background: var(--rosa-chiara);
    border-radius: 18px;
    padding: 20px 18px;
    margin: 22px 0 6px;
    text-align: center;
    color: var(--testo);
  }
  .box-busta .icona-busta { width: 30px; height: 30px; color: var(--rosa-scura); margin: 0 auto 10px; }
  .box-busta p { margin: 0; line-height: 1.5; font-size: 14px; }
  .box-busta .enfasi { color: var(--rosa-scura); font-weight: 700; display: block; margin-top: 6px; }

  .link-riserva { margin-top: 14px; font-size: 12px; color: var(--testo-muto); word-break: break-all; }
  .link-riserva .valore-link { font-weight: 600; color: var(--testo); }
  .link-riserva button {
    margin-top: 8px;
    background: none;
    border: none;
    color: var(--rosa-scura);
    font-weight: 700;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .chiusura-script { font-family: "Alex Brush", cursive; color: var(--rosa-scura); font-size: 30px; margin: 20px 0 0; }

  .riga-dettaglio { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bordo); text-align: left; }
  .riga-dettaglio .valore { color: var(--testo-muto); text-align: right; flex: 1; }
  .link-modifica { flex: none; background: none; border: none; padding: 0; color: var(--rosa-scura); font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .editor-inline { padding: 10px 0 16px; border-top: 1px dashed var(--bordo); }
  .editor-inline input[type="text"], .editor-inline input[type="number"], .editor-inline select, .editor-inline textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bordo); font-size: 15px; font-family: inherit;
  }
  .editor-opzioni { display: flex; flex-direction: column; gap: 6px; }
  .editor-opzioni label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .editor-azioni { display: flex; gap: 8px; margin-top: 10px; }
  .editor-azioni .pulsante { width: auto; flex: 1; padding: 10px 14px; font-size: 14px; }
  .sezione { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--bordo); }
  .sezione .titolo-form { font-size: 24px; margin-bottom: 10px; }
  .piede { text-align: center; padding: 16px; color: var(--testo-muto); font-size: 12px; }
  .altre-prenotazioni { margin: 18px 0; display: flex; flex-direction: column; }
  .card-prenotazione {
    text-align: left; padding: 14px 16px; margin-top: 12px; border-radius: 14px;
    border: 1px solid var(--bordo); background: var(--superficie); cursor: pointer;
  }
  .card-prenotazione:hover { border-color: var(--rosa); }
  .card-codice { font-weight: 700; }
  .card-data { color: var(--testo-muto); font-size: 14px; margin-top: 2px; }
  .card-stato { font-size: 13px; margin-top: 6px; display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--crema); }
</style>
</head>
<body>
  <div class="pagina">
    <header class="intestazione">
      <svg class="decorazione-palloncini" viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="gCorallo" cx="35%" cy="28%" r="75%">
            <stop offset="0%" style="stop-color: var(--globo2-a)" /><stop offset="100%" style="stop-color: var(--globo2-b)" />
          </radialGradient>
          <radialGradient id="gCrema" cx="35%" cy="28%" r="75%">
            <stop offset="0%" style="stop-color: var(--globo3-a)" /><stop offset="100%" style="stop-color: var(--globo3-b)" />
          </radialGradient>
          <radialGradient id="gOro" cx="35%" cy="28%" r="75%">
            <stop offset="0%" style="stop-color: var(--globo1-a)" /><stop offset="100%" style="stop-color: var(--globo1-b)" />
          </radialGradient>
          <radialGradient id="gMenta" cx="35%" cy="28%" r="75%">
            <stop offset="0%" style="stop-color: var(--globo4-a)" /><stop offset="100%" style="stop-color: var(--globo4-b)" />
          </radialGradient>
          <radialGradient id="gRosaChiaro" cx="35%" cy="28%" r="75%">

    return 'prenotazione_token_personali_' + urlToken;

    var vecchioToken = localStorage.getItem('prenotazione_token_personale_' + urlToken);
    if (vecchioToken && lista.indexOf(vecchioToken) === -1) {

    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (figli || []).forEach(function (f) { if (f) e.appendChild(f); });
    return e;
  }

  function testo(tag, classe, contenuto) {
    var e = el(tag, classe ? { class: classe } : null);
    e.textContent = contenuto;
    return e;
  }

  // Suggerimenti indirizzo (Mapbox Geocoding, solo Italia): richiesto da Greta per far scegliere
  // alla cliente un indirizzo verificato da un elenco invece di scriverlo a mano libera. Passa
  // dalla Edge Function "prenota" (azione suggerimenti_indirizzo) invece di chiamare Mapbox da
  // qui: il token resta lato server, non è un pk.* a scope pubblico sicuro da esporre nel client.
  function suggerimentiIndirizzo(testoRicerca) {
    return chiama('suggerimenti_indirizzo', { testo: testoRicerca }).then(function (corpo) {
      return (corpo && corpo.suggerimenti) || [];
    });
  }

  // navigator.clipboard può mancare o essere bloccato (browser in-app di WhatsApp/Instagram,
  // pagina non https, permesso negato): ripiega su un textarea temporaneo + execCommand('copy'),
  // che funziona in molti più contesti pur essendo un'API deprecata.
  function copiaNegliAppunti(testoDaCopiare) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(testoDaCopiare).catch(function () {
        return copiaConExecCommand(testoDaCopiare);
      });
    }
    return copiaConExecCommand(testoDaCopiare);
  }

  function copiaConExecCommand(testoDaCopiare) {
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = testoDaCopiare;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.focus();
      area.select();
      var riuscito = false;
      try {
        riuscito = document.execCommand('copy');
      } catch (e) {
        riuscito = false;
      }
      document.body.removeChild(area);
      if (riuscito) resolve();
      else reject(new Error('copia non riuscita'));
    });
  }

  // Applica la base grafica scelta dall'amministratrice per questo link (o fissata sulla
  // prenotazione al momento della bozza/invio). 'compleanno_bimbi' è il tema di default, definito
  // in :root, quindi non richiede alcuna classe.
  function applicaTema(tema) {
    document.body.className = tema && tema !== 'compleanno_bimbi' ? 'tema-' + tema : '';
  }

  // ============================================================
  // Modulo di prenotazione (nuovo, da url_token)
  // ============================================================

  function avviaModulo() {
    // Bug reale: senza questo azzeramento, chi ha già una prenotazione confermata e preme "Fai una
    // nuova prenotazione" continuava a portarsi dietro il vecchio token_personale (ancora nella
    // variabile globale) — il modulo appariva vuoto, ma all'invio veniva letto come modifica della
    // prenotazione VECCHIA (già confermata, quindi "non modificabile") invece che come nuova
    // prenotazione, bloccando l'invio senza un motivo comprensibile.
    tokenPersonale = null;
    app.innerHTML = '';
    app.appendChild(testo('p', 'caricamento', 'Caricamento del modulo…'));

    chiama('carica_link', { url_token: urlToken }).then(function (link) {
      applicaTema(link.tema);
      chiama('pacchetti_pubblici', { url_token: urlToken }).then(function (pacchetti) {
        renderModulo(link, pacchetti);
      }).catch(function () {
        renderModulo(link, []);
      });
    }).catch(function (err) {
      app.innerHTML = '';
      app.appendChild(testo('p', 'errore', err.message));
    });
  }

  function renderModulo(link, pacchetti) {
    var risposte = {};
    var domande = (link.domande || []).slice().sort(function (a, b) { return a.ordine - b.ordine; });
    var timerBozza = null;
    var mioTokenPersonale = tokenPersonale;

    app.innerHTML = '';
    app.appendChild(testo('h1', 'titolo-form', link.titolo));
    var divisore = el('div', { class: 'divisore-oro' }, [el('span', {}, [document.createTextNode('✦')])]);
    app.appendChild(divisore);
    if (link.istruzioni) app.appendChild(testo('p', 'istruzioni', link.istruzioni));

    var form = el('div', {});
    var wrapperPerId = {};
    function onCampoCambiato() {
      aggiornaVisibilitaCondizionali();
      salvaBozzaDebounced();
    }
    domande.forEach(function (domanda) {
      var wrapper = renderCampo(domanda, pacchetti, risposte, onCampoCambiato);
      wrapperPerId[domanda.id] = wrapper;
      form.appendChild(wrapper);
    });
    app.appendChild(form);
    aggiornaVisibilitaCondizionali();

    // Nasconde/mostra le domande con "mostra_se_domanda_id" in base alla risposta corrente della
    // domanda da cui dipendono — e dimentica la risposta già data se torna nascosta, così non
    // viene inviata una risposta irrilevante rimasta dietro le quinte.
    function aggiornaVisibilitaCondizionali() {
      domande.forEach(function (domanda) {
        if (!domanda.mostra_se_domanda_id) return;
        var wrapper = wrapperPerId[domanda.id];
        if (!wrapper) return;
        var valoreGate = risposte[domanda.mostra_se_domanda_id];
        var gateRisposto = valoreGate !== undefined && valoreGate !== null && valoreGate !== '';
        var soddisfatta = Array.isArray(valoreGate)
          ? valoreGate.indexOf(domanda.mostra_se_valore) !== -1
          : valoreGate === domanda.mostra_se_valore;
        // mostra_se_negato inverte il confronto: la domanda compare quando il valore NON
        // combacia, invece che quando combacia (es. nascondere "Trucca bimbi" solo quando è
        // scelto un pacchetto specifico, mostrarla per tutti gli altri). Richiede comunque che la
        // domanda da cui dipende abbia già una risposta: altrimenti "nessuna risposta" soddisfa
        // sempre la negazione e la domanda comparirebbe subito, prima ancora che la cliente
        // scelga qualcosa (bug reale: "Allega la ricevuta del pagamento" appariva da subito,
        // prima di scegliere il metodo di pagamento).
        if (domanda.mostra_se_negato) soddisfatta = gateRisposto && !soddisfatta;
        wrapper.style.display = soddisfatta ? '' : 'none';
        if (!soddisfatta) delete risposte[domanda.id];
      });
    }

    var errore = testo('p', 'errore', '');
    app.appendChild(errore);

    // Bug reale: la stellina rossa su un campo "obbligatoria" era solo decorativa, nulla
    // impediva davvero di premere "Invia prenotazione" saltando il campo (es. l'indirizzo). Qui
    // si controllano solo le domande attualmente VISIBILI: aggiornaVisibilitaCondizionali le
    // nasconde già correttamente in base alle risposte date, quindi una domanda condizionale
    // nascosta non blocca mai l'invio anche se è marcata obbligatoria.
    function trovaObbligatoriaMancante() {
      for (var i = 0; i < domande.length; i++) {
        var d = domande[i];
        if (!d.obbligatoria || d.tipo_campo === 'informativo') continue;
        var wrapper = wrapperPerId[d.id];
        if (wrapper && wrapper.style.display === 'none') continue;
        var v = risposte[d.id];
        var vuota = v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
        if (vuota) return d;
      }
      return null;
    }

    var bottone = el('button', { class: 'pulsante' });
    bottone.textContent = 'Invia prenotazione';
    bottone.onclick = function () {
      var mancante = trovaObbligatoriaMancante();
      if (mancante) {
        errore.textContent = '"' + mancante.testo + '" è obbligatorio.';
        var wrapperMancante = wrapperPerId[mancante.id];
        if (wrapperMancante) wrapperMancante.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      bottone.disabled = true;
      errore.textContent = '';
      chiama('invia', {
        url_token: mioTokenPersonale ? undefined : urlToken,
        token_personale: mioTokenPersonale || undefined,
        risposte: risposteArray(risposte),
      }).then(function (esito) {
        // Ricliccando lo stesso link (stesso dispositivo) deve ritrovare questa prenotazione
        // invece di aprirne una vuota: serve salvare qui il token_personale, non solo offrirlo
        // come link di riserva da copiare a mano. Si aggiunge alla lista (non sostituisce): con
        // più prenotazioni fatte con lo stesso link (es. una wedding planner) le ritrova tutte.
        aggiungiTokenPersonale(esito.token_personale);
        renderConferma(esito, riepilogoConferma(domande, risposte), link.nota_conferma);
      }).catch(function (err) {
        errore.textContent = err.message;
        bottone.disabled = false;
      });
    };
    app.appendChild(bottone);
    app.appendChild(testo('p', 'avviso-bozza', 'I tuoi dati vengono salvati automaticamente mentre compili.'));
    app.appendChild(decorazioneAnelli());

    function salvaBozzaDebounced() {
      clearTimeout(timerBozza);
      timerBozza = setTimeout(function () {
        chiama('salva_bozza', {
          url_token: mioTokenPersonale ? undefined : urlToken,
          token_personale: mioTokenPersonale || undefined,
          risposte: risposteArray(risposte),
        }).then(function (esito) {
          if (esito && esito.token_personale) {
            mioTokenPersonale = esito.token_personale;
            aggiungiTokenPersonale(mioTokenPersonale);
          }
        }).catch(function () { /* silenzioso: il salvataggio bozza non deve interrompere la compilazione */ });
      }, 900);
    }

    function risposteArray(mappa) {
      return Object.keys(mappa).map(function (id) { return { domanda_id: id, risposta: mappa[id] }; });
    }
  }

  // Estrae 1-2 campi significativi (tipo evento, data) dalle risposte appena inviate, per
  // mostrarli nella schermata di conferma: invia_prenotazione non li restituisce, ma li abbiamo
  // già qui lato client, senza bisogno di un'altra chiamata.
  function riepilogoConferma(domande, risposte) {
    var perChiave = {};
    domande.forEach(function (d) {
      if (d.chiave_destinazione && risposte[d.id] !== undefined && risposte[d.id] !== '') {
        perChiave[d.chiave_destinazione] = { label: d.testo, valore: risposte[d.id] };
      }
    });
    var righe = [];
    if (perChiave.tipo_evento) righe.push({ chiave: 'tipo_evento', label: 'Tipo di evento', valore: perChiave.tipo_evento.valore });
    if (perChiave.inizio_evento) righe.push({ chiave: 'inizio_evento', label: 'Data', valore: formattaData(perChiave.inizio_evento.valore) });
    return righe;
  }

  function formattaData(valore) {
    var d = new Date(valore);
    if (isNaN(d.getTime())) return String(valore);
    return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  var GIORNI_SETTIMANA = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];

  // Formatta 'YYYY-MM-DD' (valore grezzo di un <input type="date">) in stile italiano GG/MM/AAAA
  // con il giorno della settimana tra parentesi — costruisce la data dai singoli numeri invece di
  // affidarsi al parsing di new Date(stringaIso), per evitare ambiguità di fuso orario tra il
  // giorno digitato dalla cliente e quello mostrato.
  function formattaDataConGiorno(valoreIso) {
    var match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(valoreIso));
    if (!match) return String(valoreIso);
    var anno = Number(match[1]), mese = Number(match[2]), giorno = Number(match[3]);
    var d = new Date(anno, mese - 1, giorno);
    var gg = String(giorno).padStart(2, '0');
    var mm = String(mese).padStart(2, '0');
    return gg + '/' + mm + '/' + anno + ' (' + GIORNI_SETTIMANA[d.getDay()] + ')';
  }

  function iconaCampo(domanda) {
    if (domanda.chiave_destinazione === 'tipo_evento' && temaCorrente() === 'intrattenimento_adulti') {
      return ICONE.cocktail;
    }
    var nome = ICONA_PER_CHIAVE[domanda.chiave_destinazione];
    return nome ? ICONE[nome] : null;
  }

  function renderCampo(domanda, pacchetti, risposte, onCambia) {
    var wrapper = el('div', { class: 'campo' });
    var label = el('label', {});
    label.textContent = domanda.testo + (domanda.obbligatoria ? ' ' : '');
    if (domanda.obbligatoria) {
      var stellina = el('span', { class: 'obbligatoria' });
      stellina.textContent = '*';
      label.appendChild(stellina);
    }
    wrapper.appendChild(label);

    function segna(valore) {
      risposte[domanda.id] = valore;
      onCambia();
    }

    if (domanda.tipo_campo === 'pacchetto') {
      var selectPacchetto = el('select', {});
      selectPacchetto.appendChild(el('option', { value: '' }));
      pacchetti.forEach(function (p) {
        var opt = el('option', { value: p.id });
        opt.textContent = p.nome;
        selectPacchetto.appendChild(opt);
      });
      selectPacchetto.onchange = function () { segna(selectPacchetto.value); };
      wrapper.appendChild(selectPacchetto);
    } else if (domanda.tipo_campo === 'foto') {
      var inputFoto = el('input', { type: 'file', accept: 'image/*' });
      var statoFoto = testo('p', 'descrizione', 'Nessuna foto scelta.');
      var erroreFoto = testo('p', 'errore', '');
      inputFoto.onchange = function () {
        var file = inputFoto.files && inputFoto.files[0];
        if (!file) return;
        erroreFoto.textContent = '';
        if (!/^image\//.test(file.type)) {
          erroreFoto.textContent = 'Scegli un file immagine (JPG, PNG, WEBP).';
          inputFoto.value = '';
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          erroreFoto.textContent = 'Foto troppo grande: usa un\'immagine sotto gli 8 MB.';
          inputFoto.value = '';
          return;
        }
        statoFoto.textContent = 'Caricamento in corso…';
        var reader = new FileReader();
        reader.onload = function () {
          var base64 = String(reader.result).split(',')[1] || '';
          chiama('carica_foto_risposta', {
            url_token: urlToken,
            contenuto_base64: base64,
            tipo_mime: file.type,
          }).then(function (esito) {
            statoFoto.textContent = 'Foto caricata: ' + file.name;
            segna(esito.percorso);
          }).catch(function (err) {
            erroreFoto.textContent = err.message;
            statoFoto.textContent = 'Nessuna foto scelta.';
            inputFoto.value = '';
          });
        };
        reader.readAsDataURL(file);
      };
      wrapper.appendChild(inputFoto);
      wrapper.appendChild(statoFoto);
      wrapper.appendChild(erroreFoto);
    } else if (domanda.tipo_campo === 'note') {
      var area = el('textarea', { placeholder: domanda.placeholder || '' });
      area.oninput = function () { segna(area.value); };
      wrapper.appendChild(area);
    } else if (domanda.tipo_campo === 'informativo') {
      // Nessun campo dove scrivere: solo testo di sola lettura, con il pulsante "Copia" gestito
      // più sotto insieme a quello di 'note'.
    } else if (domanda.tipo_campo === 'scelta_singola' && domanda.opzioni) {
      domanda.opzioni.forEach(function (opzione) {
        var riga = el('div', { class: 'opzioni-riga' });
        var input = el('input', { type: 'radio', name: domanda.id });
        input.onchange = function () { segna(opzione); };
        riga.appendChild(input);
        riga.appendChild(testo('span', null, opzione));
        wrapper.appendChild(riga);
      });
    } else if (domanda.tipo_campo === 'scelta_multipla' && domanda.opzioni) {
      var selezionate = [];
      domanda.opzioni.forEach(function (opzione) {
        var riga = el('div', { class: 'opzioni-riga' });
        var input = el('input', { type: 'checkbox' });
        input.onchange = function () {
          if (input.checked) selezionate.push(opzione);
          else selezionate = selezionate.filter(function (o) { return o !== opzione; });
          segna(selezionate.slice());
        };
        riga.appendChild(input);
        riga.appendChild(testo('span', null, opzione));
        wrapper.appendChild(riga);
      });
    } else if (domanda.tipo_campo === 'selezione_da_elenco' && domanda.opzioni) {
      var select = el('select', {});
      select.appendChild(el('option', { value: '' }));
      domanda.opzioni.forEach(function (opzione) {
        var opt = el('option', { value: opzione });
        opt.textContent = opzione;
        select.appendChild(opt);
      });
      select.onchange = function () { segna(select.value); };
      wrapper.appendChild(select);
    } else if (domanda.chiave_destinazione === 'indirizzo_evento') {
      var inputIndirizzo = el('input', { type: 'text', placeholder: domanda.placeholder || '', autocomplete: 'off' });
      inputIndirizzo.oninput = function () { segna(inputIndirizzo.value); };
      var listaSuggerimenti = el('ul', { class: 'suggerimenti-indirizzo' });
      listaSuggerimenti.style.display = 'none';
      var timerRicerca = null;
      function nascondiSuggerimenti() { listaSuggerimenti.style.display = 'none'; listaSuggerimenti.innerHTML = ''; }
      inputIndirizzo.oninput = function () {
        segna(inputIndirizzo.value);
        clearTimeout(timerRicerca);
        var valore = inputIndirizzo.value.trim();
        if (valore.length < 5) { nascondiSuggerimenti(); return; }
        timerRicerca = setTimeout(function () {
          suggerimentiIndirizzo(valore).then(function (suggerimenti) {
            if (inputIndirizzo.value.trim() !== valore) return; // la cliente ha continuato a scrivere nel frattempo
            listaSuggerimenti.innerHTML = '';
            if (suggerimenti.length === 0) { nascondiSuggerimenti(); return; }
            suggerimenti.forEach(function (indirizzo) {
              var voce = el('li', {});
              voce.textContent = indirizzo;
              voce.onmousedown = function (ev) {
                ev.preventDefault(); // evita che il blur dell'input nasconda la lista prima del click
                inputIndirizzo.value = indirizzo;
                segna(indirizzo);
                nascondiSuggerimenti();
              };
              listaSuggerimenti.appendChild(voce);
            });
            listaSuggerimenti.style.display = 'block';
          }).catch(function () { nascondiSuggerimenti(); });
        }, 300);
      };
      inputIndirizzo.onblur = function () { setTimeout(nascondiSuggerimenti, 150); };
      var iconaIndirizzo = iconaCampo(domanda);
      var involucroIndirizzo = el('div', { class: 'campo-input-wrap' }, [
        iconaIndirizzo ? el('span', { class: 'campo-icona', html: iconaIndirizzo }) : null,
        inputIndirizzo,
        listaSuggerimenti,
      ]);
      wrapper.appendChild(involucroIndirizzo);
    } else {
      var tipoInput = domanda.tipo_campo === 'numerico' ? 'number'
        : domanda.tipo_campo === 'data' ? 'date'
        : domanda.tipo_campo === 'orario' ? 'time'
        : 'text';
      var input2 = el('input', { type: tipoInput, placeholder: domanda.placeholder || '' });
      input2.oninput = function () { segna(input2.value); };
      var icona = iconaCampo(domanda);
      if (icona) {
        var involucro = el('div', { class: 'campo-input-wrap' }, [
          el('span', { class: 'campo-icona', html: icona }),
          input2,
        ]);
        wrapper.appendChild(involucro);
      } else {
        wrapper.appendChild(input2);
      }
    }

    if (domanda.descrizione) {
      wrapper.appendChild(testo('p', 'descrizione', domanda.descrizione));
      if (domanda.tipo_campo === 'note' || domanda.tipo_campo === 'informativo') {
        var testoDaCopiare = domanda.descrizione;
        var copiaDescrizione = el('button', { type: 'button', class: 'copia-descrizione' });
        copiaDescrizione.textContent = 'Copia';
        copiaDescrizione.onclick = function () {
          copiaNegliAppunti(testoDaCopiare).then(function () {
            copiaDescrizione.textContent = 'Copiato ✓';
            setTimeout(function () { copiaDescrizione.textContent = 'Copia'; }, 2000);
          }).catch(function () {
            copiaDescrizione.textContent = 'Tieni premuto il testo sopra per copiarlo';
            setTimeout(function () { copiaDescrizione.textContent = 'Copia'; }, 3000);
          });
        };
        wrapper.appendChild(copiaDescrizione);
      }
    }
    return wrapper;
  }

  function rigaIcona(nomeIcona, label, valore) {
    return el('div', { class: 'riga-icona' }, [
      el('div', { class: 'cerchio-icona', html: ICONE[nomeIcona] || ICONE.persona }),
      el('div', {}, [
        testo('div', 'riga-icona-label', label.toUpperCase()),
        testo('div', 'riga-icona-valore', valore),
      ]),
    ]);
  }

  function renderConferma(esito, riepilogo, notaConferma) {
    app.innerHTML = '';
    var box = el('div', { class: 'schermata-conferma' });
    box.appendChild(testo('h1', 'titolo-serif', 'Prenotazione'));
    box.appendChild(testo('div', 'titolo-script-rosa', 'confermata!'));

    if (esito.codice_prenotazione) {
      box.appendChild(el('div', { class: 'riga-ribbon' }, [
        el('span', { class: 'stella' }, [document.createTextNode('★')]),
        testo('div', 'ribbon-codice', esito.codice_prenotazione),
        el('span', { class: 'stella' }, [document.createTextNode('★')]),
      ]));
    }

    var tema = temaCorrente();
    var scheda = el('div', { class: 'scheda-grazie' });
    var iconaGrazie = tema === 'matrimonio_bimbi' ? ICONE.coronaCheck
      : tema === 'intrattenimento_adulti' ? ICONE.burstCheck
      : ICONE.calendarioCheck;
    scheda.appendChild(el('div', { class: 'cerchio-icona-grande', html: iconaGrazie }));
    var grazie = el('p', { class: 'testo-grazie' });
    grazie.appendChild(el('b', {}, [document.createTextNode('Grazie! ')]));
    grazie.appendChild(document.createTextNode('La tua festa è in buone mani.'));
    scheda.appendChild(grazie);
    scheda.appendChild(testo('div', 'cuore-divisore', '♥'));
    (riepilogo || []).forEach(function (r) {
      var nomeIcona = r.chiave === 'tipo_evento' && tema === 'intrattenimento_adulti'
        ? 'cocktail'
        : ICONA_PER_CHIAVE[r.chiave] || 'festa';
      scheda.appendChild(rigaIcona(nomeIcona, r.label, r.valore));
    });
    box.appendChild(scheda);

    var busta = el('div', { class: 'box-busta' });
    busta.appendChild(el('div', { class: 'icona-busta', html: ICONE.busta }));
    var p1 = el('p');
    p1.appendChild(document.createTextNode('Il link che ti è stato mandato per messaggio ti permette di rivedere o modificare la tua prenotazione.'));
    p1.appendChild(el('span', { class: 'enfasi' }, [document.createTextNode('Ricliccalo quando vuoi, tornerai alla tua prenotazione!')]));
    busta.appendChild(p1);
    box.appendChild(busta);

    if (notaConferma) {
      var notaBox = el('div', { class: 'box-busta' });
      var notaTesto = el('p');
      notaTesto.textContent = notaConferma;
      notaBox.appendChild(notaTesto);
      box.appendChild(notaBox);
    }

    var tokenSalvato = esito.token_personale;
    if (tokenSalvato) {
      var linkPersonale = location.origin + location.pathname + '?p=' + tokenSalvato;
      var riserva = el('div', { class: 'link-riserva' });
      riserva.appendChild(document.createTextNode('Se in futuro usi un telefono diverso, questo è un link di riserva:'));
      var copia = el('button');
      copia.textContent = 'Copia link di riserva';
      copia.onclick = function () {
        navigator.clipboard.writeText(linkPersonale).then(function () {
          copia.textContent = 'Copiato ✓';
        });
      };
      riserva.appendChild(document.createElement('br'));
      riserva.appendChild(copia);
      box.appendChild(riserva);
    }

    box.appendChild(testo('div', 'chiusura-script', 'Ci vediamo presto!'));
    box.appendChild(decorazioneAnelli());

    app.appendChild(box);
  }

  // ============================================================
  // Vista personale (da token personale ?p=)
  // ============================================================

  function avviaVistaPersonale() {
    app.innerHTML = '';
    app.appendChild(testo('p', 'caricamento', 'Caricamento della tua prenotazione…'));

    chiama('carica_prenotazione', { token_personale: tokenPersonale }).then(function (p) {
      applicaTema(p.tema);
      if (p.stato_prenotazione === 'in_compilazione') {
        avviaModuloDaBozza(p);
        return;
      }
      chiama('pacchetti_pubblici', {}).then(function (pacchetti) {
        renderVistaPersonale(p, pacchetti);
      }).catch(function () {
        renderVistaPersonale(p, []);
      });
    }).catch(function (err) {
      app.innerHTML = '';
      app.appendChild(testo('p', 'errore', err.message));
    });
  }

  var STATO_PRENOTAZIONE_LABEL = {
    confermata: 'Confermata',
    annullata: 'Annullata',
    in_compilazione: 'In compilazione',
  };

  // Elenco di tutte le prenotazioni fatte con questo link su questo dispositivo (2 o più): per chi,
  // come una wedding planner, ne fa diverse. Ogni token non più valido (es. revocato
  // dall'amministratrice) viene tolto silenziosamente dalla lista, non mostrato come errore.
  function avviaElencoPrenotazioni(tokenList) {
    app.innerHTML = '';
    app.appendChild(testo('p', 'caricamento', 'Caricamento delle tue prenotazioni…'));

    Promise.all(
      tokenList.map(function (tok) {
        return chiama('carica_prenotazione', { token_personale: tok })
          .then(function (p) { return { tok: tok, p: p }; })
          .catch(function () {
            rimuoviTokenPersonale(tok);
            return null;
          });
      })
    ).then(function (risultati) {
      var validi = risultati.filter(function (r) { return r !== null; });
      applicaTema(validi.length > 0 ? validi[0].p.tema : null);
      app.innerHTML = '';
      app.appendChild(testo('h1', 'titolo-form', 'Le tue prenotazioni'));

      if (validi.length === 0) {
        app.appendChild(testo('p', 'istruzioni', 'Non risulta ancora nessuna prenotazione valida su questo dispositivo.'));
      }

      validi.forEach(function (r) {
        var dataTrovata = null;
        (r.p.risposte_cliente || []).some(function (risp) {
          if (risp.tipo_campo === 'data' && typeof risp.risposta === 'string') {
            dataTrovata = formattaDataConGiorno(risp.risposta);
            return true;
          }
          return false;
        });
        var card = el('div', { class: 'card-prenotazione' });
        card.appendChild(testo('div', 'card-codice', r.p.codice_prenotazione || r.p.titolo_link_snapshot || 'Prenotazione'));
        if (dataTrovata) card.appendChild(testo('div', 'card-data', dataTrovata));
        card.appendChild(testo('div', 'card-stato', STATO_PRENOTAZIONE_LABEL[r.p.stato_prenotazione] || r.p.stato_prenotazione));
        card.onclick = function () {
          tokenPersonale = r.tok;
          avviaVistaPersonale();
        };
        app.appendChild(card);
      });

      var bottoneNuova = el('button', { class: 'pulsante' });
      bottoneNuova.style.marginTop = '16px';
      bottoneNuova.textContent = 'Fai una nuova prenotazione';
      bottoneNuova.onclick = function () { avviaModulo(); };
      app.appendChild(bottoneNuova);
    });
  }

  function renderVistaPersonale(p, pacchetti) {
    app.innerHTML = '';

    var nomiPacchetto = {};
    (pacchetti || []).forEach(function (pacc) { nomiPacchetto[pacc.id] = pacc.nome; });

    app.appendChild(testo('h1', 'titolo-form', p.titolo_link_snapshot || 'La tua prenotazione'));
    if (p.codice_prenotazione) {
      app.appendChild(el('div', { class: 'riga-ribbon' }, [
        el('span', { class: 'stella' }, [document.createTextNode('★')]),
        testo('div', 'ribbon-codice', p.codice_prenotazione),
        el('span', { class: 'stella' }, [document.createTextNode('★')]),
      ]));
    }

    // Sempre visibile (anche su una prenotazione annullata o di sola lettura): non deve mai essere
    // un vicolo cieco, che si tratti di prenotare di nuovo o di rivedere le altre già fatte con
    // questo stesso link (es. una wedding planner con più prenotazioni).
    var azioniAltrePrenotazioni = el('div', { class: 'altre-prenotazioni' });
    var bottoneNuova = el('button', { class: 'pulsante secondario' });
    bottoneNuova.textContent = 'Fai una nuova prenotazione';
    bottoneNuova.onclick = function () { avviaModulo(); };
    azioniAltrePrenotazioni.appendChild(bottoneNuova);
    if (leggiTokenPersonali().length > 1) {
      var bottoneElenco = el('button', { class: 'pulsante secondario' });
      bottoneElenco.textContent = 'Vedi tutte le tue prenotazioni';
      bottoneElenco.style.marginTop = '8px';
      bottoneElenco.onclick = function () { avviaElencoPrenotazioni(leggiTokenPersonali()); };
      azioniAltrePrenotazioni.appendChild(bottoneElenco);
    }
    app.appendChild(azioniAltrePrenotazioni);

    if (p.stato_prenotazione === 'annullata') {
      app.appendChild(testo('p', 'errore', 'Questa prenotazione è stata annullata.'));
      return;
    }

    // Campi che l'amministratrice ha reso modificabili dalla cliente (stessa whitelist di
    // richiedi_modifica_prenotazione_cliente) — su richiesta di Greta, un tasto "Modifica" di
    // fianco a ogni sezione modificabile, non solo il generico "Hai bisogno di cambiare
    // qualcosa?" più sotto. Ogni modifica va comunque in approvazione (stessa richiesta già usata
    // da quella sezione), non è un salvataggio diretto: la cliente non può cambiare da sola dati
    // che l'amministratrice deve rivedere (es. l'importo).
    var CHIAVI_MODIFICABILI_RICHIESTA = [
      'tipo_evento', 'tipo_location', 'cliente', 'cliente_telefono', 'cliente_email',
      'nome_festeggiato', 'indirizzo_evento', 'citta_evento', 'truccabimbi_o_tatuaggi',
      'importo_da_riscuotere_cliente', 'anticipo_richiesto', 'outfit_richiesta_cliente',
      'informazioni_da_sapere',
    ];
    var TIPI_CAMPO_EDITABILI_INLINE = [
      'testo_libero', 'note', 'numerico', 'selezione_da_elenco', 'scelta_singola', 'scelta_multipla',
    ];
    var richiestaPendente = !!(p.richiesta_modifica_corrente && p.richiesta_modifica_corrente.stato === 'in_attesa');

    function costruisceEditorInline(domandaOriginale, r, onSalva, onAnnulla) {
      var editor = el('div', { class: 'editor-inline' });
      var input;
      var opzioni = (domandaOriginale && domandaOriginale.opzioni) || [];

      if (r.tipo_campo === 'scelta_multipla') {
        var selezionati = Array.isArray(r.risposta) ? r.risposta.slice() : [];
        var box = el('div', { class: 'editor-opzioni' });
        opzioni.forEach(function (op) {
          var id = 'chk-' + r.domanda_id + '-' + op;
          var check = el('input', { type: 'checkbox', id: id, value: op });
          check.checked = selezionati.indexOf(op) !== -1;
          check.onchange = function () {
            selezionati = check.checked
              ? selezionati.concat([op])
              : selezionati.filter(function (v) { return v !== op; });
          };
          var label = el('label', { for: id }, [check, document.createTextNode(' ' + op)]);
          box.appendChild(label);
        });
        editor.appendChild(box);
        input = { leggiValore: function () { return selezionati; } };
      } else if (r.tipo_campo === 'selezione_da_elenco' || r.tipo_campo === 'scelta_singola') {
        var select = el('select', {});
        opzioni.forEach(function (op) {
          var opt = el('option', { value: op });
          opt.textContent = op;
          if (op === r.risposta) opt.selected = true;
          select.appendChild(opt);
        });
        editor.appendChild(select);
        input = { leggiValore: function () { return select.value; } };
      } else if (r.tipo_campo === 'numerico') {
        var numerico = el('input', { type: 'number', value: r.risposta != null ? r.risposta : '' });
        editor.appendChild(numerico);
        input = { leggiValore: function () { return numerico.value === '' ? null : Number(numerico.value); } };
      } else if (r.tipo_campo === 'note') {
        var area = el('textarea', {});
        area.value = typeof r.risposta === 'string' ? r.risposta : '';
        editor.appendChild(area);
        input = { leggiValore: function () { return area.value; } };
      } else {
        var testoInput = el('input', { type: 'text', value: typeof r.risposta === 'string' ? r.risposta : '' });
        editor.appendChild(testoInput);
        input = { leggiValore: function () { return testoInput.value; } };
      }

      var erroreEditor = testo('p', 'errore', '');
      var azioni = el('div', { class: 'editor-azioni' });
      var bottoneSalva = el('button', { class: 'pulsante secondario' });
      bottoneSalva.textContent = 'Invia richiesta';
      bottoneSalva.onclick = function () {
        bottoneSalva.disabled = true;
        onSalva(input.leggiValore()).catch(function (err) {
          erroreEditor.textContent = err.message;
          bottoneSalva.disabled = false;
        });
      };
      var bottoneAnnulla = el('button', { class: 'pulsante secondario' });
      bottoneAnnulla.textContent = 'Annulla';
      bottoneAnnulla.onclick = onAnnulla;
      azioni.appendChild(bottoneSalva);
      azioni.appendChild(bottoneAnnulla);
      editor.appendChild(azioni);
      editor.appendChild(erroreEditor);
      return editor;
    }

    var sezioneDettagli = el('div', { class: 'sezione' });
    (p.risposte_cliente || []).forEach(function (r) {
      var domandaOriginale = (p.domande_snapshot || []).find(function (d) { return d.id === r.domanda_id; });
      var contenitoreRiga = el('div', {});
      var riga = el('div', { class: 'riga-dettaglio' });
      riga.appendChild(testo('span', null, r.testo_domanda));
      var valoreTesto = r.tipo_campo === 'pacchetto' && nomiPacchetto[r.risposta]
        ? nomiPacchetto[r.risposta]
        : r.tipo_campo === 'data' && typeof r.risposta === 'string'
          ? formattaDataConGiorno(r.risposta)
          : (typeof r.risposta === 'object' ? JSON.stringify(r.risposta) : String(r.risposta || '—'));
      var valore = testo('span', 'valore', valoreTesto);
      riga.appendChild(valore);

      var puoModificare = !p.sola_lettura && !richiestaPendente
        && CHIAVI_MODIFICABILI_RICHIESTA.indexOf(r.chiave_destinazione) !== -1
        && TIPI_CAMPO_EDITABILI_INLINE.indexOf(r.tipo_campo) !== -1;

      if (puoModificare) {
        var bottoneModifica = el('button', { class: 'link-modifica' });
        bottoneModifica.textContent = 'Modifica';
        bottoneModifica.onclick = function () {
          var editor = costruisceEditorInline(domandaOriginale, r, function (nuovoValore) {
            return chiama('richiedi_modifica', {
              token_personale: tokenPersonale,
              campi_richiesti: [{ campo: r.chiave_destinazione, valore_attuale: r.risposta, valore_richiesto: nuovoValore }],
              nota_cliente: 'Modifica richiesta: "' + r.testo_domanda + '"',
            }).then(function () { avviaVistaPersonale(); });
          }, function () {
            contenitoreRiga.removeChild(editor);
            riga.style.display = '';
          });
          riga.style.display = 'none';
          contenitoreRiga.appendChild(editor);
        };
        riga.appendChild(bottoneModifica);
      }

      contenitoreRiga.appendChild(riga);
      sezioneDettagli.appendChild(contenitoreRiga);
    });
    app.appendChild(sezioneDettagli);
    if (richiestaPendente) {
      sezioneDettagli.appendChild(testo('p', 'istruzioni', 'Hai già una richiesta di modifica in attesa: potrai chiederne un\'altra dopo che sarà stata gestita.'));
    }

    if (p.sola_lettura) {
      app.appendChild(testo('p', 'istruzioni', 'La modifica non è più disponibile per questo evento.'));
      return;
    }

    // Numero bambini
    var sezioneBambini = el('div', { class: 'sezione' });
    sezioneBambini.appendChild(testo('h2', 'titolo-form', 'Numero di bambini'));
    var inputBambini = el('input', { type: 'number', value: p.numero_bambini || '' });
    sezioneBambini.appendChild(inputBambini);
    var salvaBambini = el('button', { class: 'pulsante secondario' });
    salvaBambini.style.marginTop = '10px';
    salvaBambini.textContent = p.numero_bambini_confermato_il ? 'Aggiorna numero' : 'Salva numero';
    var erroreBambini = testo('p', 'errore', '');
    salvaBambini.onclick = function () {
      var azione = 'aggiorna_numero_bambini';
      chiama(azione, { token_personale: tokenPersonale, numero_bambini: Number(inputBambini.value) })
        .then(function () { salvaBambini.textContent = 'Salvato ✓'; })
        .catch(function (err) { erroreBambini.textContent = err.message; });
    };
    sezioneBambini.appendChild(salvaBambini);
    sezioneBambini.appendChild(erroreBambini);
    app.appendChild(sezioneBambini);

    // Ricevuta del bonifico: solo per chi ha scelto quel metodo di pagamento. Separata dal modulo
    // principale perché spesso si paga DOPO aver prenotato — qui si può allegare (o sostituire) la
    // ricevuta in qualsiasi momento, anche oltre la finestra dei 14gg di modifica diretta.
    if (p.metodo_pagamento === 'Anticipato con bonifico') {
      var sezioneRicevuta = el('div', { class: 'sezione' });
      sezioneRicevuta.appendChild(testo('h2', 'titolo-form', 'Ricevuta del bonifico'));
      sezioneRicevuta.appendChild(testo('p', 'istruzioni', p.ricevuta_bonifico_path
        ? 'Ricevuta già allegata. Puoi caricarne un\'altra per sostituirla.'
        : 'Quando hai effettuato il bonifico, allega qui la ricevuta.'));
      var inputRicevuta = el('input', { type: 'file', accept: 'image/*' });
      var statoRicevuta = testo('p', 'descrizione', p.ricevuta_bonifico_path ? 'Ricevuta allegata ✓' : 'Nessuna foto scelta.');
      var erroreRicevuta = testo('p', 'errore', '');
      inputRicevuta.onchange = function () {
        var file = inputRicevuta.files && inputRicevuta.files[0];
        if (!file) return;
        erroreRicevuta.textContent = '';
        if (!/^image\//.test(file.type)) {
          erroreRicevuta.textContent = 'Scegli un file immagine (JPG, PNG, WEBP).';
          inputRicevuta.value = '';
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          erroreRicevuta.textContent = 'Foto troppo grande: usa un\'immagine sotto gli 8 MB.';
          inputRicevuta.value = '';
          return;
        }
        statoRicevuta.textContent = 'Caricamento in corso…';
        var reader = new FileReader();
        reader.onload = function () {
          var base64 = String(reader.result).split(',')[1] || '';
          chiama('salva_ricevuta_bonifico', {
            token_personale: tokenPersonale,
            contenuto_base64: base64,
            tipo_mime: file.type,
          }).then(function () {
            statoRicevuta.textContent = 'Ricevuta caricata: ' + file.name;
          }).catch(function (err) {
            erroreRicevuta.textContent = err.message;
            statoRicevuta.textContent = 'Nessuna foto scelta.';
            inputRicevuta.value = '';
          });
        };
        reader.readAsDataURL(file);
      };
      sezioneRicevuta.appendChild(inputRicevuta);
      sezioneRicevuta.appendChild(statoRicevuta);
      sezioneRicevuta.appendChild(erroreRicevuta);
      app.appendChild(sezioneRicevuta);
    }

    // Richiesta di modifica ai dati principali (oltre 14gg si modifica diretto, sotto si passa da qui)
    var sezioneRichiesta = el('div', { class: 'sezione' });
    sezioneRichiesta.appendChild(testo('h2', 'titolo-form', 'Hai bisogno di cambiare qualcosa?'));
    if (p.richiesta_modifica_corrente && p.richiesta_modifica_corrente.stato === 'in_attesa') {
      sezioneRichiesta.appendChild(testo('p', 'istruzioni', 'Hai già una richiesta di modifica in attesa di risposta.'));
    } else {
      var notaRichiesta = el('textarea', { placeholder: 'Scrivi qui cosa vorresti cambiare…' });
      sezioneRichiesta.appendChild(notaRichiesta);
      var bottoneRichiesta = el('button', { class: 'pulsante secondario' });
      bottoneRichiesta.style.marginTop = '10px';
      bottoneRichiesta.textContent = 'Invia richiesta di modifica';
      var erroreRichiesta = testo('p', 'errore', '');
      bottoneRichiesta.onclick = function () {
        if (!notaRichiesta.value.trim()) { erroreRichiesta.textContent = 'Scrivi cosa vorresti cambiare.'; return; }
        chiama('richiedi_modifica', {
          token_personale: tokenPersonale,
          campi_richiesti: [{ campo: 'informazioni_da_sapere', valore_attuale: null, valore_richiesto: notaRichiesta.value.trim() }],
          nota_cliente: notaRichiesta.value.trim(),
        }).then(function () {
          bottoneRichiesta.textContent = 'Richiesta inviata ✓';
          bottoneRichiesta.disabled = true;
        }).catch(function (err) { erroreRichiesta.textContent = err.message; });
      };
      sezioneRichiesta.appendChild(bottoneRichiesta);
      sezioneRichiesta.appendChild(erroreRichiesta);
    }
    app.appendChild(sezioneRichiesta);

    // Annullamento
    var sezioneAnnulla = el('div', { class: 'sezione' });
    var bottoneAnnulla = el('button', { class: 'pulsante pericolo' });
    bottoneAnnulla.textContent = 'Annulla la mia prenotazione';
    var erroreAnnulla = testo('p', 'errore', '');
    bottoneAnnulla.onclick = function () {
      if (!confirm('Vuoi davvero annullare questa prenotazione?')) return;
      chiama('richiedi_annullamento', { token_personale: tokenPersonale })
        .then(function () { location.reload(); })
        .catch(function (err) { erroreAnnulla.textContent = err.message; });
    };
    sezioneAnnulla.appendChild(bottoneAnnulla);
    sezioneAnnulla.appendChild(erroreAnnulla);
    app.appendChild(sezioneAnnulla);
  }

  function avviaModuloDaBozza(p) {
    chiama('pacchetti_pubblici', {}).then(function (pacchetti) {
      renderModuloBozza(p, pacchetti);
    }).catch(function () {
      renderModuloBozza(p, []);
    });
  }

  function renderModuloBozza(p, pacchetti) {
    var link = {
      titolo: p.titolo_link_snapshot,
      istruzioni: p.istruzioni_link_snapshot,
      domande: p.domande_snapshot || [],
    };
    renderModulo(link, pacchetti);
  }

  // ============================================================

  if (tokenPersonaleDaUrl) {
    // Link personale esplicito (?p=...): apre sempre direttamente quella prenotazione, comprese
    // le annullate — è il link "di riserva" condiviso apposta per quella prenotazione specifica.
    tokenPersonale = tokenPersonaleDaUrl;
    avviaVistaPersonale();
  } else if (urlToken) {
    var tokenSalvati = leggiTokenPersonali();
    if (tokenSalvati.length === 1) {
      // Comportamento invariato: un'unica prenotazione già fatta con questo link, si rientra
      // direttamente lì (comprese le prenotazioni annullate, che ora offrono comunque un bottone
      // "Fai una nuova prenotazione" invece di essere un vicolo cieco).
      tokenPersonale = tokenSalvati[0];
      avviaVistaPersonale();
    } else if (tokenSalvati.length > 1) {
      // Più prenotazioni fatte con lo stesso link su questo dispositivo (es. una wedding planner):
      // elenco con la possibilità di rientrare in una qualsiasi o farne una nuova.
      avviaElencoPrenotazioni(tokenSalvati);
    } else {
      avviaModulo();
    }
  } else {
    app.innerHTML = '';
    app.appendChild(testo('p', 'errore', 'Link non valido.'));
  }
})();
  </script>
</body>
</html>
