<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Com'è andata la festa? — Greta Animazione e Allestimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cioccolato-scuro: #3e2723;
    --cioccolato: #5c2e1f;
    --crema: #fdf6ec;
    --beige: #f1e3ce;
    --beige-bordo: #dfc9a3;
    --verde: #7cb342;
    --verde-scuro: #33691e;
    --oro: #e0a800;
    --superficie: #ffffff;
    --errore: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: "Poppins", sans-serif; color: var(--cioccolato-scuro); background: var(--crema); }
  main { max-width: 460px; margin: 0 auto; padding: 32px 20px 56px; }
  .intestazione { text-align: center; margin-bottom: 8px; }
  .riga-logo { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .logo-testo { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 1px; }
  .logo-palloncino { width: 30px; height: 42px; }
  .logo-sottotitolo { display: block; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: var(--cioccolato); }
  h1 { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 26px; text-align: center; margin: 22px 0 6px; }
  .intro { text-align: center; font-size: 14.5px; line-height: 1.55; margin: 0 0 22px; color: var(--cioccolato); }
  .blocco { background: var(--superficie); border: 1px solid var(--beige-bordo); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .blocco h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .stelle { display: flex; justify-content: center; gap: 8px; }
  .stella { border: none; background: none; padding: 2px; cursor: pointer; font-size: 40px; line-height: 1; color: var(--beige-bordo); }
  .stella.piena { color: var(--oro); }
  .opzione { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; font-size: 14.5px; line-height: 1.4; cursor: pointer; }
  .opzione input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--verde-scuro); flex: none; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--beige-bordo); border-radius: 12px; padding: 12px; font-family: inherit; font-size: 14.5px; color: inherit; background: var(--crema); resize: vertical; }
  .pillole { display: flex; gap: 10px; }
  .pillola { flex: 1; padding: 12px; border: 1px solid var(--beige-bordo); border-radius: 12px; background: var(--crema); font-family: inherit; font-size: 15px; font-weight: 600; color: inherit; cursor: pointer; }
  .pillola.selezionata { background: var(--verde); border-color: var(--verde); color: var(--verde-scuro); }
  .pulsante { width: 100%; margin-top: 8px; padding: 16px; border: none; border-radius: 14px; background: var(--verde); color: var(--verde-scuro); font-family: "Baloo 2", sans-serif; font-weight: 700; font-size: 18px; cursor: pointer; }
  .pulsante[disabled] { opacity: 0.6; cursor: default; }
  .errore { text-align: center; color: var(--errore); font-size: 14px; margin-top: 12px; }
  .conferma { text-align: center; }
  .conferma-icona { width: 84px; height: 84px; margin: 28px auto 16px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center; }
  .conferma-icona svg { width: 42px; height: 42px; color: var(--verde-scuro); }
  .conferma p { font-size: 16px; line-height: 1.6; margin: 0; }
  .nascosto { display: none; }
</style>
</head>
<body>
<main id="app"><p style="text-align:center;">Caricamento…</p></main>
<script>
(function () {
  var API_URL = 'https://mvzxzynapaegqmhkfpqa.supabase.co/functions/v1/prenota';
  var segmenti = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  var token = segmenti.length > 1 ? decodeURIComponent(segmenti.slice(1).join('/')) : '';
  var app = document.getElementById('app');

  var PROBLEMI = [
    "Puntualità o arrivo dell'animatrice",
    'Orari non rispettati o durata',
    "Comportamento dell'animatrice",
    "L'animatrice non è stata in grado di intrattenere i bambini",
    'Giochi e attività poco adatti o troppo pochi',
    "Costume, aspetto o cura dell'animatrice",
    'Materiali e allestimento (mancanti o rovinati)',
    'Organizzazione e comunicazione prima della festa',
    'Altro'
  ];

  var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var PALLONCINO = '<svg viewBox="0 0 20 28" fill="none"><ellipse cx="10" cy="10" rx="9" ry="10" fill="#7CB342"/><path d="M10 20v6" stroke="#5C2E1F" stroke-width="1.4"/><path d="M8.5 20.5c1 .6 2 .6 3 0" stroke="#5C2E1F" stroke-width="1.2" fill="none"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>';

  function el(tag, attrs, figli) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'testo') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (figli || []).forEach(function (f) { if (f) n.appendChild(f); });
    return n;
  }
  function chiama(azione, payload) {
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ azione: azione }, payload))
    }).then(function (r) {
      return r.json().then(function (corpo) {
        if (!r.ok) throw new Error(corpo.errore || 'Si è verificato un problema, riprova.');
        return corpo.dati;
      });
    });
  }
  function intestazione() {
    return el('div', { class: 'intestazione' }, [
      el('div', { class: 'riga-logo' }, [
        el('span', { class: 'logo-testo', testo: 'GRETA' }),
        el('span', { class: 'logo-palloncino', html: PALLONCINO })
      ]),
      el('span', { class: 'logo-sottotitolo', testo: 'ANIMAZIONI & ALLESTIMENTI' })
    ]);
  }
  function schermataConferma(messaggio) {
    app.innerHTML = '';
    app.appendChild(intestazione());
    app.appendChild(el('div', { class: 'conferma' }, [
      el('div', { class: 'conferma-icona', html: CHECK }),
      el('p', { testo: messaggio })
    ]));
  }
  function schermataErrore(messaggio) {
    app.innerHTML = '';
    app.appendChild(intestazione());
    app.appendChild(el('p', { class: 'errore', testo: messaggio }));
  }

  function renderModulo(info) {
    app.innerHTML = '';
    app.appendChild(intestazione());
    app.appendChild(el('h1', { testo: "Com'è andata la festa?" }));

    var intro = 'Grazie per averci scelto! ';
    if (info.data_evento) {
      var d = new Date(info.data_evento);
      intro += 'Raccontaci com’è andata la festa del ' + d.getDate() + ' ' + MESI[d.getMonth()];
      intro += info.nome_animatrice ? ' con ' + info.nome_animatrice + '.' : '.';
    }
    app.appendChild(el('p', { class: 'intro', testo: intro }));

    var voto = 0;
    var stelleEl = [];
    var boxStelle = el('div', { class: 'stelle' });
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = el('button', { type: 'button', class: 'stella', 'aria-label': n + ' stelle', testo: '★' });
        b.addEventListener('click', function () {
          voto = n;
          stelleEl.forEach(function (s, idx) { s.classList.toggle('piena', idx < n); });
        });
        stelleEl.push(b);
        boxStelle.appendChild(b);
      })(i);
    }
    app.appendChild(el('div', { class: 'blocco' }, [
      el('h2', { testo: "Com'è andata la festa in generale?" }),
      boxStelle
    ]));

    var caselle = [];
    var boxProblemi = el('div', { class: 'blocco' }, [el('h2', { testo: 'Cosa non è andato bene? (puoi sceglierne più di una)' })]);
    var areaAltro = el('textarea', { placeholder: 'Spiega cosa non è andato' });
    var boxAltro = el('div', { class: 'nascosto' }, [areaAltro]);
    PROBLEMI.forEach(function (voce) {
      var cb = el('input', { type: 'checkbox', value: voce });
      cb.addEventListener('change', function () {
        if (voce === 'Altro') boxAltro.classList.toggle('nascosto', !cb.checked);
      });
      caselle.push(cb);
      boxProblemi.appendChild(el('label', { class: 'opzione' }, [cb, el('span', { testo: voce })]));
    });
    boxProblemi.appendChild(boxAltro);
    app.appendChild(boxProblemi);

    var racconto = el('textarea', { placeholder: 'Scrivi qui (facoltativo)' });
    app.appendChild(el('div', { class: 'blocco' }, [
      el('h2', { testo: 'Raccontaci cosa è successo e come possiamo migliorare' }),
      racconto
    ]));

    var ricontatto = null;
    var pSi = el('button', { type: 'button', class: 'pillola', testo: 'Sì' });
    var pNo = el('button', { type: 'button', class: 'pillola', testo: 'No' });
    function scegli(val) {
      ricontatto = val;
      pSi.classList.toggle('selezionata', val === true);
      pNo.classList.toggle('selezionata', val === false);
    }
    pSi.addEventListener('click', function () { scegli(true); });
    pNo.addEventListener('click', function () { scegli(false); });
    app.appendChild(el('div', { class: 'blocco' }, [
      el('h2', { testo: 'Vuoi che Greta ti ricontatti?' }),
      el('div', { class: 'pillole' }, [pSi, pNo])
    ]));

    var errore = el('p', { class: 'errore' });
    var invia = el('button', { type: 'button', class: 'pulsante', testo: 'Invia' });
    invia.addEventListener('click', function () {
      errore.textContent = '';
      if (!voto) { errore.textContent = 'Scegli un voto da 1 a 5 stelle.'; return; }
      var scelti = caselle.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
      var testoAltro = areaAltro.value.trim();
      if (scelti.indexOf('Altro') !== -1 && !testoAltro) { errore.textContent = 'Spiega cosa non è andato nel campo "Altro".'; return; }
      invia.disabled = true;
      chiama('invia_feedback', {
        token: token, voto: voto, problemi: scelti,
        altro: scelti.indexOf('Altro') !== -1 ? testoAltro : null,
        racconto: racconto.value.trim() || null,
        ricontatto: ricontatto === true
      }).then(function () {
        schermataConferma('Grazie mille della tua pazienza per aver completato il questionario: per noi è molto importante.');
      }).catch(function (err) {
        errore.textContent = err.message;
        invia.disabled = false;
      });
    });
    app.appendChild(invia);
    app.appendChild(errore);
  }

  if (!token) { schermataErrore('Link non valido.'); return; }
  chiama('carica_feedback', { token: token }).then(function (info) {
    if (info.gia_compilato) schermataConferma('Hai già inviato il questionario: grazie mille, per noi è molto importante!');
    else renderModulo(info);
  }).catch(function (err) { schermataErrore(err.message); });
})();
</script>
</body>
</html>
